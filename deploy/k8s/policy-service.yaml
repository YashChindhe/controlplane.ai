apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-service
  labels:
    app: policy-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: policy-service
  template:
    metadata:
      labels:
        app: policy-service
    spec:
      containers:
        - name: policy-service
          image: policy-service:latest
          ports:
            - containerPort: 8001
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: POLICY_DATABASE_URL
---
apiVersion: v1
kind: Service
metadata:
  name: policy-service
spec:
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
  selector:
    app: policy-service
  type: ClusterIP
