apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane-gateway
  labels:
    app: controlplane-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: controlplane-gateway
  template:
    metadata:
      labels:
        app: controlplane-gateway
    spec:
      containers:
        - name: gateway
          image: controlplane-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 512Mi
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: controlplane-gateway
spec:
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: controlplane-gateway
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: controlplane-gateway-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: controlplane-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
