version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: controlplane-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: controlplane
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d controlplane"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: controlplane-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.19
    container_name: controlplane-redpanda
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "19092:19092"
      - "8082:8082"
    volumes:
      - redpanda_data:/var/lib/redpanda
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 5s
      timeout: 5s
      retries: 5

  policy-service:
    build:
      context: ./apps/policy-service
    container_name: controlplane-policy-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/controlplane
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  audit-service:
    build:
      context: ./apps/audit-service
    container_name: controlplane-audit-service
    environment:
      - KAFKA_BROKERS=redpanda:9092
      - ELASTICSEARCH_URL=http://localhost:9200
    ports:
      - "8002:8002"
    depends_on:
      redpanda:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: ./apps/gateway/Dockerfile
    container_name: controlplane-gateway
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=redpanda:9092
      - TRI_GUARD_URL=http://host.docker.internal:8000
      - POLICY_SERVICE_URL=http://policy-service:8001
      - AUDIT_SERVICE_URL=http://audit-service:8002
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      policy-service:
        condition: service_started
      audit-service:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: ./apps/dashboard/Dockerfile
    container_name: controlplane-dashboard
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
    depends_on:
      - gateway

volumes:
  postgres_data:
  redis_data:
  redpanda_data:


